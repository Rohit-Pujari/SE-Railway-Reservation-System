<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#333"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#171717}.title{font-size:32px;font-weight:bold}.sub{font-size:19px}.head{font-size:23px;font-weight:bold}.name{font-size:19px}.note{font-size:16px}.frame{fill:white;stroke:#222;stroke-width:2.5}.comp{fill:#fff;stroke:#222;stroke-width:2.2}.line{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arr)}.dashed{stroke:#666;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arr)}.chip{fill:white;stroke:#222;stroke-width:2}</style><rect width="1600" height="1030" fill="white"/><text x="800" y="55" text-anchor="middle" class="title">Railway Reservation System - UML Component Diagram</text><text x="800" y="87" text-anchor="middle" class="sub">Layered application architecture and component dependencies</text><rect x="40" y="140" width="350" height="760" rx="6" class="frame"/><text x="215" y="179" text-anchor="middle" class="head">Presentation Layer</text><rect x="77" y="230" width="270" height="110" class="comp"/><text x="212" y="270" text-anchor="middle" class="name">Passenger / Admin</text><text x="212" y="298" text-anchor="middle" class="name">Web Browser</text><rect x="77" y="440" width="270" height="140" class="comp"/><text x="212" y="485" text-anchor="middle" class="name">React / Vite Frontend</text><text x="212" y="517" text-anchor="middle" class="note">Search, Booking, History</text><text x="212" y="543" text-anchor="middle" class="note">and Admin Dashboard</text><path d="M212 340 V440" class="line"/><rect x="430" y="140" width="760" height="760" rx="6" class="frame"/><text x="810" y="179" text-anchor="middle" class="head">Backend - Django / REST Framework</text><rect x="625" y="225" width="370" height="105" class="comp"/><text x="810" y="264" text-anchor="middle" class="name">API Views / Controllers</text><text x="810" y="294" text-anchor="middle" class="note">HTTP JSON /api</text><rect x="625" y="365" width="370" height="80" class="comp"/><text x="810" y="399" text-anchor="middle" class="name">Session / CSRF / Role Checks</text><text x="810" y="424" text-anchor="middle" class="note">Authentication and authorization</text><path d="M347 510 H520 V275 H625" class="line"/><text x="450" y="495" class="note">HTTP / JSON</text><path d="M810 330 V365" class="line"/><rect x="468" y="500" width="205" height="110" class="comp"/><text x="570" y="535" text-anchor="middle" class="name">Train Search</text><text x="570" y="564" text-anchor="middle" class="note">and Seat Availability</text><rect x="702" y="500" width="205" height="110" class="comp"/><text x="805" y="535" text-anchor="middle" class="name">Booking / Fare</text><text x="805" y="564" text-anchor="middle" class="note">PNR and Seat Holds</text><rect x="936" y="500" width="205" height="110" class="comp"/><text x="1039" y="535" text-anchor="middle" class="name">Simulated Payment</text><text x="1039" y="564" text-anchor="middle" class="note">Confirm and Queue</text><rect x="585" y="665" width="205" height="110" class="comp"/><text x="687" y="702" text-anchor="middle" class="name">Cancellation</text><text x="687" y="731" text-anchor="middle" class="note">Pending Refunds</text><rect x="825" y="665" width="205" height="110" class="comp"/><text x="927" y="702" text-anchor="middle" class="name">Admin Services</text><text x="927" y="731" text-anchor="middle" class="note">Railway Master Data</text><path d="M810 445 V473 H570 V500" class="line"/><path d="M810 445 V500" class="line"/><path d="M810 473 H1039 V500" class="line"/><path d="M810 445 V640 H687 V665" class="line"/><path d="M810 640 H927 V665" class="line"/><rect x="1230" y="140" width="330" height="760" rx="6" class="frame"/><text x="1395" y="179" text-anchor="middle" class="head">Persistence Layer</text><rect x="1270" y="450" width="250" height="160" rx="12" class="comp"/><text x="1395" y="500" text-anchor="middle" class="name">MySQL / InnoDB</text><text x="1395" y="534" text-anchor="middle" class="note">Bookings, Trains, Users</text><text x="1395" y="561" text-anchor="middle" class="note">Transactions and Locks</text><path d="M1141 555 H1270" class="line"/><path d="M1141 555 V815 H1395 V610" class="dashed"/><text x="1208" y="790" text-anchor="middle" class="note">SQL services</text><text x="800" y="961" text-anchor="middle" class="sub">Simulated payment and queued notifications are internal components; no external gateway is integrated.</text></svg>