<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940"><style>text{font-family:Arial;fill:#183153}.a{font-size:22px;font-weight:bold}.b{font-size:18px}.box{fill:#f8fbff;stroke:#183153;stroke-width:3}.oval{fill:white;stroke:#183153;stroke-width:2}line{stroke:#789;stroke-width:2}</style><text x="600" y="40" class="a" text-anchor="middle">Railway Reservation System - Use Case Diagram</text><rect x="270" y="70" width="900" height="840" rx="15" class="box"/><text x="720" y="105" class="a" text-anchor="middle">System Boundary</text><text x="75" y="310" class="a">Passenger</text><text x="45" y="720" class="a">Administrator</text><line x1="190" y1="310" x2="330" y2="155"/><ellipse cx="480" cy="155" rx="150" ry="33" class="oval"/><text x="480" y="161" text-anchor="middle" class="b">Register and sign in</text><line x1="190" y1="310" x2="330" y2="270"/><ellipse cx="480" cy="270" rx="150" ry="33" class="oval"/><text x="480" y="276" text-anchor="middle" class="b">Search trains and seats</text><line x1="190" y1="310" x2="330" y2="385"/><ellipse cx="480" cy="385" rx="150" ry="33" class="oval"/><text x="480" y="391" text-anchor="middle" class="b">Reserve seats and generate PNR</text><line x1="190" y1="310" x2="330" y2="500"/><ellipse cx="480" cy="500" rx="150" ry="33" class="oval"/><text x="480" y="506" text-anchor="middle" class="b">Confirm simulated payment</text><line x1="190" y1="310" x2="330" y2="615"/><ellipse cx="480" cy="615" rx="150" ry="33" class="oval"/><text x="480" y="621" text-anchor="middle" class="b">View booking history</text><line x1="190" y1="310" x2="330" y2="730"/><ellipse cx="480" cy="730" rx="150" ry="33" class="oval"/><text x="480" y="736" text-anchor="middle" class="b">Cancel booking and refund</text><line x1="200" y1="720" x2="745" y2="230"/><ellipse cx="930" cy="230" rx="185" ry="34" class="oval"/><text x="930" y="236" text-anchor="middle" class="b">Admin authentication</text><line x1="200" y1="720" x2="745" y2="395"/><ellipse cx="930" cy="395"