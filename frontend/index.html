<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search scheduled trains for your railway journey.">
  <title>Railway Reservation System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="welcome-card search-card" aria-labelledby="search-title">
      <p class="eyebrow">Railway Reservation System</p>
      <h1 id="search-title">Find a train</h1>
      <p class="intro">Choose your stations and journey date to see scheduled trains.</p>
      <form id="train-search-form">
        <label for="source-station">From</label>
        <select id="source-station" name="source_station_id" required disabled>
          <option value="">Loading stations…</option>
        </select>
        <label for="destination-station">To</label>
        <select id="destination-station" name="destination_station_id" required disabled>
          <option value="">Loading stations…</option>
        </select>
        <label for="journey-date">Journey date</label>
        <input id="journey-date" name="journey_date" type="date" required>
        <button type="submit" id="search-button" disabled>Search trains</button>
        <p id="search-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <section id="search-results" class="search-results" aria-labelledby="results-title" hidden>
        <h2 id="results-title">Matching trains</h2>
        <p id="results-summary" class="results-summary"></p>
        <div id="train-results-list" class="train-results-list"></div>
      </section>
    </section>

    <section class="welcome-card registration-card" aria-labelledby="registration-title">
      <h2 id="registration-title">Create your account</h2>
      <p class="intro">Register to get started with railway reservations.</p>
      <form id="registration-form" novalidate>
        <label for="full-name">Full name</label>
        <input id="full-name" name="full_name" autocomplete="name" maxlength="120" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="phone-number">Phone number <span>(optional)</span></label>
        <input id="phone-number" name="phone_number" type="tel" autocomplete="tel" maxlength="25">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-help">
        <p id="password-help" class="field-help">8–128 characters, including uppercase, lowercase, and a number.</p>
        <button type="submit" id="register-button">Create account</button>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <div class="service-status" role="status" aria-live="polite">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="api-status">Checking backend connection…</span>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
