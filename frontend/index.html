<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Railway Reservation System">
  <title>Railway Reservation System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="welcome-card" aria-labelledby="page-title">
      <p class="eyebrow">Railway Reservation System</p>
      <h1 id="page-title">Welcome</h1>
      <p class="intro">Sign in to your account or create a new one.</p>
      <div class="auth-tabs" role="group" aria-label="Account options">
        <button type="button" id="show-login" class="secondary-button" aria-pressed="true">Login</button>
        <button type="button" id="show-register" class="secondary-button" aria-pressed="false">Register</button>
      </div>
      <form id="login-form" novalidate>
        <label for="login-email">Email address</label>
        <input id="login-email" name="email" type="email" autocomplete="username" maxlength="254" required>
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button type="submit" id="login-button">Login</button>
      </form>
      <form id="registration-form" hidden novalidate>
        <label for="full-name">Full name</label>
        <input id="full-name" name="full_name" autocomplete="name" maxlength="120" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="phone-number">Phone number <span>(optional)</span></label>
        <input id="phone-number" name="phone_number" type="tel" autocomplete="tel" maxlength="25">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-help">
        <p id="password-help" class="field-help">8–128 characters, including uppercase, lowercase, and a number.</p>
        <button type="submit" id="register-button">Create account</button>
      </form>
      <section id="account-panel" hidden aria-live="polite">
        <h2 id="account-heading">You're signed in</h2>
        <p id="account-details"></p>
        <button type="button" id="logout-button">Logout</button>
      </section>
      <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      <div class="service-status" role="status" aria-live="polite">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="api-status">Checking backend connection…</span>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
